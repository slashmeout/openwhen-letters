<!DOCTYPE html>
<html>
<head>
  <title>Secure Document</title>

  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
    }

    /* LOADING */
    #loading {
      font-size: 20px;
      text-align: center;
    }

    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #00ffcc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* CONTENT */
    #content {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .envelope {
      width: 200px;
      height: 120px;
      background: #ccc;
      border-radius: 5px;
      cursor: pointer;
      position: relative;
    }

    .envelope:before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-top: 60px solid #aaa;
    }

    /* GLITCH TEXT */
    .message {
      display: none;
      margin-top: 20px;
      font-family: monospace;
      font-size: 28px;
      color: #00ffcc;
      text-align: center;
      position: relative;
      animation: shake 0.1s infinite;
    }

    /* Glitch layers */
    .message::before,
    .message::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      width: 100%;
      overflow: hidden;
    }

    .message::before {
      color: red;
      animation: glitchTop 0.3s infinite;
    }

    .message::after {
      color: blue;
      animation: glitchBottom 0.3s infinite;
    }

    /* Animations */
    @keyframes shake {
      0% { transform: translate(1px, -1px); }
      25% { transform: translate(-1px, 1px); }
      50% { transform: translate(1px, 1px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(1px, -1px); }
    }

    @keyframes glitchTop {
      0% { clip-path: inset(0 0 80% 0); transform: translate(-2px, -2px); }
      50% { clip-path: inset(0 0 60% 0); transform: translate(2px, 2px); }
      100% { clip-path: inset(0 0 80% 0); transform: translate(-2px, -2px); }
    }

    @keyframes glitchBottom {
      0% { clip-path: inset(80% 0 0 0); transform: translate(2px, 2px); }
      50% { clip-path: inset(60% 0 0 0); transform: translate(-2px, -2px); }
      100% { clip-path: inset(80% 0 0 0); transform: translate(2px, 2px); }
    }
  </style>
</head>

<body>

<!-- LOADING -->
<div id="loading">
  <div>Decrypting Secure File...</div>
  <div class="spinner"></div>
</div>

<!-- CONTENT -->
<div id="content">
  <div class="envelope" onclick="openLetter()"></div>

  <div class="message" id="msg" data-text="YOU ARE AN IDIOT :)">
<pre>
YOU ARE AN IDIOT :)

   (^_^)
</pre>
  </div>
</div>

<!-- SOUND -->
<audio id="sound" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<script>
  setTimeout(() => {
    document.getElementById("loading").style.display = "none";
    document.getElementById("content").style.display = "flex";
  }, 3000);

  function openLetter() {
    document.querySelector('.envelope').style.display = 'none';
    document.getElementById('msg').style.display = 'block';
    document.getElementById('sound').play();
  }
</script>

</body>
</html>
